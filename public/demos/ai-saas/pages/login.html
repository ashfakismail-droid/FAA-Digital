<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovaAI Login - Access your AI workspace.">
  <title>Log In - NovaAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to continue to NovaAI</p>
      </div>

      <form class="auth-form" id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" class="form-input" id="email" required placeholder="you@example.com">
          <div class="error-message" id="emailError">Please enter a valid email address</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-input" id="password" required placeholder="••••••••">
          <div class="error-message" id="passwordError">Password is required</div>
        </div>
        <div class="form-group" style="display: flex; align-items: center; justify-content: space-between;">
          <label style="display: flex; align-items: center; gap: var(--space-xs); cursor: pointer; font-size: var(--text-sm);">
            <input type="checkbox" id="rememberMe"> Remember me
          </label>
          <a href="#" style="font-size: var(--text-sm);">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Log In</button>
      </form>

      <div class="auth-footer">
        <p style="color: var(--color-text-secondary); font-size: var(--text-sm);">
          Don't have an account? <a href="signup.html">Sign Up</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');

    const validateEmail = (email) => {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      let valid = true;

      if (!validateEmail(emailInput.value)) {
        emailError.classList.add('visible');
        valid = false;
      } else {
        emailError.classList.remove('visible');
      }

      if (!passwordInput.value) {
        passwordError.classList.add('visible');
        valid = false;
      } else {
        passwordError.classList.remove('visible');
      }

      if (valid) {
        alert('Login successful! Redirecting to dashboard...');
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 800);
      }
    });

    emailInput.addEventListener('input', () => {
      if (validateEmail(emailInput.value)) {
        emailError.classList.remove('visible');
      }
    });

    passwordInput.addEventListener('input', () => {
      if (passwordInput.value) {
        passwordError.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
