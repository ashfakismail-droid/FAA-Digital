<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NovaAI Profile - Manage your personal account and preferences.">
  <title>Profile - NovaAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="../index.html" class="sidebar-logo">NovaAI</a>
      </div>

      <nav class="nav-section">
        <div class="nav-section-title">Main</div>
        <ul class="sidebar-nav">
          <li><a href="dashboard.html"><span class="nav-icon">📊</span><span>Dashboard</span></a></li>
          <li><a href="chat.html"><span class="nav-icon">💬</span><span>Chat</span></a></li>
          <li><a href="analytics.html"><span class="nav-icon">📈</span><span>Analytics</span></a></li>
          <li><a href="projects.html"><span class="nav-icon">📁</span><span>Projects</span></a></li>
          <li><a href="documents.html"><span class="nav-icon">📄</span><span>Documents</span></a></li>
        </ul>
      </nav>

      <nav class="nav-section">
        <div class="nav-section-title">Account</div>
        <ul class="sidebar-nav">
          <li><a href="settings.html"><span class="nav-icon">⚙️</span><span>Settings</span></a></li>
          <li><a href="profile.html" class="active"><span class="nav-icon">👤</span><span>Profile</span></a></li>
          <li><a href="../index.html"><span class="nav-icon">⬅️</span><span>Log out</span></a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="app-header">
        <div class="container header-content">
          <h1 style="font-size: var(--text-2xl); margin: 0;">Profile</h1>
        </div>
      </header>

      <div class="container-fluid" style="padding: var(--space-xl);">
        <div class="analytics-grid" style="margin-bottom: var(--space-xl);">
          <div class="analytics-card">
            <div class="analytics-header">
              <span class="analytics-title">Credits Remaining</span>
            </div>
            <div class="analytics-value">1,548</div>
            <span class="analytics-title">of 10,000 monthly</span>
          </div>
          <div class="analytics-card">
            <div class="analytics-header">
              <span class="analytics-title">Member Since</span>
            </div>
            <div class="analytics-value">Jan 2024</div>
            <span class="analytics-title">Pro plan</span>
          </div>
        </div>

        <div class="glass-card" style="max-width: 600px;">
          <div class="avatar-wrapper">
            <div class="avatar">AL</div>
            <div class="avatar-edit" id="avatarEdit">✏️</div>
          </div>

          <div class="form-section">
            <h3 style="font-size: var(--text-lg); margin-bottom: var(--space-md);">Personal Information</h3>
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" class="form-input" value="Alex" id="firstName">
              </div>
              <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" class="form-input" value="Lee" id="lastName">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-input" value="alex.lee@example.com" id="email">
            </div>
            <div class="form-group">
              <label class="form-label">Company</label>
              <input type="text" class="form-input" value="InnovateCorp" id="company">
            </div>
          </div>

          <div class="form-section">
            <h3 style="font-size: var(--text-lg); margin-bottom: var(--space-md);">Security</h3>
            <div class="form-group">
              <button class="btn btn-outline" id="changePassword">Change Password</button>
            </div>
            <div class="form-group">
              <button class="btn btn-outline" id="enable2fa">Enable 2FA</button>
            </div>
          </div>

          <div style="margin-top: var(--space-xl);">
            <button class="btn btn-primary btn-lg" id="saveProfile">Save Profile</button>
            <button class="btn btn-outline btn-lg" style="margin-left: var(--space-sm);">Cancel</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Avatar edit placeholder
    document.getElementById('avatarEdit').addEventListener('click', () => {
      alert('Avatar upload dialog (demo action)');
    });

    // Profile actions
    document.getElementById('changePassword').addEventListener('click', () => {
      alert('Password change dialog (demo action)');
    });

    document.getElementById('enable2fa').addEventListener('click', () => {
      alert('Two-factor authentication setup (demo action)');
    });

    document.getElementById('saveProfile').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const error = document.getElementById('emailError');
      if (email && !email.includes('@')) {
        alert('Please enter a valid email address');
        return;
      }
      alert('Profile saved successfully!');
    });
  </script>
</body>
</html>
